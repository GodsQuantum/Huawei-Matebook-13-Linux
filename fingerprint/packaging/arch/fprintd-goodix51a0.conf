[Unit]
# The fingerprint device must be fully enumerated before the graphical login
# manager starts.  Plasma Login Manager queries authentication capabilities at
# greeter startup; allowing it to win this race can hide fingerprint login for
# the lifetime of the greeter even though fprintd becomes ready moments later.
After=systemd-udev-trigger.service
Before=display-manager.service

[Service]
# Keep the normal fprintd process and its libfprint device object alive so the
# driver's validated in-process TLS/background/FDT warm state can survive Claim/Release.
ExecStart=
ExecStart=/usr/lib/fprintd --no-timeout

# GXFP51A0 uses the Linux GPIO character-device API for IRQ polling and reset.
DeviceAllow=char-gpiochip rw

# Warm RAM can contain TLS/key-derived material and background image data.
# Native probe executes the existing full, bounded SPI/TLS/image recovery
# BEFORE fprintd acquires its D-Bus name. Pegasus sets a global 15-second
# startup timeout; that is shorter than a sometimes-necessary 16-46s cold
# sensor recovery. Limit only THIS EXISTING fprintd service, never globally.
TimeoutStartSec=90s
LimitCORE=0
# GXFP51A0 QA62 shadow-imaging experiment, NOT full hardware certification.
# Preserves stock fprintd and rel71.74 flags. Separate QA57/58/59 gates
# retain strict TLS, matcher threshold 7 and typed FDT.
# Negative-finger, S4 and repeatability gates remain open.
Environment=GXFP_S3_FRESH_BG_QA=1 GXFP_FDT_DOWN_PROOF_QA=1 GXFP_SPI_CS_SETUP_QA=1 GXFP_S4_MIDCAPTURE_REUSE_QA=1 GXFP_RESUME_PERF_QA=1 GXFP_CAPTURE_PERF_QA=1 GXFP_RESUME_FAST_SETTLE_QA=1 GXFP_RESUME_STAGE_QA=1 GXFP_PMK_CACHE_SKIP_RESET_QA=1 GXFP_HELD_FINGER_ROLLING_BG_QA=1 GXFP_POSTAUTH_CLEANUP_DEFER_QA=1 GXFP_FDT_DOWN_TYPED_REPLY_QA=1 GXFP_MATCH_DIAGNOSTICS=1 GXFP_FIRST_POLL_HELD_QA=1 GXFP_ROTATION_RESCUE_QA=1 GXFP_DECOUPLE_ACK_PACING_QA=1 GXFP_POST_NAV_SETTLE_QA=1 GXFP_S3_CALIBRATION_EARLY_REUSE_QA=1 GXFP_FDT_IRQ_DIAG_QA=1 GXFP_EARLY_HELD_FAST_AUTH_QA=1 GXFP_STALE_LOCAL_SHADOW_QA=1
