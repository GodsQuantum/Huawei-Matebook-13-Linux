name: GXFP51A0 all-states candidate QA

on:
  push:
    branches:
      - qa/gxfp51a0-rel71.51-plm681-20261023
    paths:
      - 'fingerprint/**'
      - '.github/workflows/gxfp51a0-all-states-qa.yml'
  pull_request:
    paths:
      - 'fingerprint/**'
      - '.github/workflows/gxfp51a0-all-states-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-safety:
    name: libfprint driver source and regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 pkg-config             libglib2.0-dev libgusb-dev libcairo2-dev libgudev-1.0-dev             libssl-dev libudev-dev
      - name: Source regression and native libfprint build
        run: make -C fingerprint verify
      - name: S3 post-worker cancellation gates
        run: python3 fingerprint/research/tests/test_s3_async_cancel_completion.py
      - name: No biometric source material
        shell: bash
        run: |
          set -euo pipefail
          ! find fingerprint -type f \( -name '*.pgm' -o -name '*.raw' -o -name '*.npy' \) -print -quit | grep -q .
          ! grep -RInE --exclude-dir=.git '(/home/[A-Za-z0-9._-]+|192\.168\.[0-9]{1,3}\.[0-9]{1,3})' fingerprint

  plasma-login-source:
    name: KDE 6.8.1 dual PAM and fail-closed QA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Pin official KDE 6.8.1 tarball and fuzz-free patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/plm-src
          cd /tmp/plm-src
          curl -fsSL --retry 3 -o plasma-login-manager-6.8.1.tar.xz             https://download.kde.org/stable/plasma/6.8.1/plasma-login-manager-6.8.1.tar.xz
          echo 'c9228146d26878a2d236ae6fc3460e0722cf4d62bf86ddf7ae1d5011c8d7d7d7  plasma-login-manager-6.8.1.tar.xz' | sha256sum -c -
          tar -xf plasma-login-manager-6.8.1.tar.xz
          cd plasma-login-manager-6.8.1
          patch --batch --fuzz=0 -Np1 -i "$GITHUB_WORKSPACE/fingerprint/integration/plasma-login-manager-6.8.1-qa/0001-plasma-login-6.8.1-native-dual-fingerprint-password.patch"
          test -f data/pam/arch/plasmalogin-fingerprint
      - name: Native dual-PAM invariants and unchanged password PAM
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v6.8.1 https://github.com/KDE/plasma-login-manager.git /tmp/plm-git
          cd /tmp/plm-git
          patch --batch --fuzz=0 -Np1 -i "$GITHUB_WORKSPACE/fingerprint/integration/plasma-login-manager-6.8.1-qa/0001-plasma-login-6.8.1-native-dual-fingerprint-password.patch"
          PLM_QA_UPSTREAM=/tmp/plm-git python3 "$GITHUB_WORKSPACE/fingerprint/integration/plasma-login-manager-6.8.1-qa/test_native_login_qa.py"

  plasma-login-build:
    name: KDE 6.8.1 native Arch integration build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build and stage-install in disposable Arch container
        run: |
          mkdir -p "$RUNNER_TEMP/plm-source" "$RUNNER_TEMP/plm-build"
          docker run --rm --network bridge             -v "$GITHUB_WORKSPACE/fingerprint/integration/plasma-login-manager-6.8.1-qa:/input:ro"             -v "$RUNNER_TEMP/plm-source:/src:rw"             -v "$RUNNER_TEMP/plm-build:/work:rw"             archlinux:base-devel /bin/bash -ec '
              pacman -Syu --needed --noconfirm                 cmake extra-cmake-modules ninja pkgconf python curl                 qt6-base qt6-declarative qt6-tools qt6-5compat qt6-shadertools                 kconfig kcoreaddons kwindowsystem ki18n kdbusaddons kio                 kcmutils kauth kpackage kservice kirigami libkscreen libplasma                 layer-shell-qt plasma-workspace libxau pam systemd
              curl -fsSL --retry 3 -o /src/plm.tar.xz                 https://download.kde.org/stable/plasma/6.8.1/plasma-login-manager-6.8.1.tar.xz
              echo "c9228146d26878a2d236ae6fc3460e0722cf4d62bf86ddf7ae1d5011c8d7d7d7  /src/plm.tar.xz" | sha256sum -c -
              tar -xf /src/plm.tar.xz -C /src
              cd /src/plasma-login-manager-6.8.1
              patch --batch --fuzz=0 -Np1 -i /input/0001-plasma-login-6.8.1-native-dual-fingerprint-password.patch
              cmake -S . -B /work/build -G Ninja                 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBEXECDIR=lib                 -DDBUS_CONFIG_FILENAME=plasma_org.freedesktop.DisplayManager.conf
              cmake --build /work/build -j 4
              DESTDIR=/work/stage cmake --install /work/build
              test -f /work/stage/usr/lib/pam.d/plasmalogin-fingerprint
              # -DCMAKE_INSTALL_LIBEXECDIR=lib selects /usr/lib, not
              # /usr/lib/libexec (the default with a different prefix).
              test -f /work/stage/usr/lib/plasma-login-greeter
              test -f /work/stage/usr/lib/plasmalogin-helper
              echo PLM_681_NATIVE_CI_BUILD_PASS
            '
